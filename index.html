<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" href="power-patch.svg" type="image/svg+xml">
<title>Power ATS</title>
<meta name="description" content="Power Advanced Technology Solutions – Power-Tools">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: one dark screen. Intro: a precise oscilloscope beam sweeps across and reveals the logo behind its head; the pulse then returns periodically and lights the wordmark; then a CAN bus runs along the bottom. Single dark look by design. */
:root{
  --bg:#08090b; --fg:#eceeee; --muted:#8a9296; --red:#ee2522; --hot:#FFECBE;
  --f-body:"IBM Plex Sans","Segoe UI",system-ui,sans-serif; --f-mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 var(--f-body);overflow:hidden;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
html[data-lang="en"] [lang="it"], html:not([data-lang="en"]) [lang="en"]{display:none!important}
canvas{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}
#fx{z-index:2}
#bus{z-index:0;opacity:.6}
.stage{position:relative;z-index:1;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:40px;text-align:center}
#logo{width:min(680px,90vw);height:auto;display:block;clip-path:inset(-30% 100% -30% 0);filter:drop-shadow(0 10px 40px rgba(238,37,34,0));transition:filter 1.2s ease-out}
#logo.on{clip-path:none;filter:drop-shadow(0 10px 40px rgba(238,37,34,.22))}
.after{display:flex;flex-direction:column;align-items:center;gap:18px;opacity:0;transform:translateY(8px);transition:opacity .8s ease-out .2s,transform .8s ease-out .2s}
.after.on{opacity:1;transform:none}
.tag{font:500 .74rem/1 var(--f-mono);letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}
.enter{display:inline-flex;align-items:center;gap:10px;padding:13px 24px;border:1px solid var(--red);color:var(--fg);
  text-decoration:none;border-radius:3px;font:600 .95rem/1 var(--f-body);letter-spacing:.04em;transition:background .2s,box-shadow .2s}
.enter:hover,.enter:focus-visible{background:var(--red);box-shadow:0 0 28px rgba(238,37,34,.55)}
.enter:focus-visible{outline:2px solid var(--fg);outline-offset:3px}
.enter span{transition:transform .2s}.enter:hover span{transform:translateX(4px)}
.lang{position:fixed;z-index:3;top:calc(16px + env(safe-area-inset-top,0px));right:max(16px,env(safe-area-inset-right,0px));
  display:flex;border:1px solid #2a3135;border-radius:4px;overflow:hidden}
.lang button{font:500 .72rem/1 var(--f-mono);letter-spacing:.08em;padding:7px 10px;background:transparent;color:var(--muted);border:0;cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--red);color:#fff}
.lang button:focus-visible{outline:2px solid var(--fg);outline-offset:-2px}
.foot{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom,0px));left:0;right:0;text-align:center;
  font:400 .7rem/1 var(--f-mono);color:#4d565b;letter-spacing:.1em;z-index:1;pointer-events:none}
</style>
</head>

<script>
/* ---------- lingua (condivisa con sito.html) ---------- */
(function(){
  var root=document.documentElement,k="power-lang",l=null;
  try{l=localStorage.getItem(k)}catch(e){}
  if(l!=="it"&&l!=="en")l=(navigator.language||"it").toLowerCase().indexOf("it")===0?"it":"en";
  function set(x){root.setAttribute("data-lang",x);root.lang=x;
    document.querySelectorAll(".lang button").forEach(function(b){b.setAttribute("aria-pressed",b.dataset.l===x)});
    try{localStorage.setItem(k,x)}catch(e){}}
  document.querySelectorAll(".lang button").forEach(function(b){b.addEventListener("click",function(){set(b.dataset.l)})});
  set(l);
})();

(function(){
  var RED="#ee2522", HOT="#FFECBE";
  var reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
  var logo=document.getElementById("logo"), after=document.getElementById("after"), sheen=document.getElementById("sheen-r");
  var fx=document.getElementById("fx"), c=fx.getContext("2d");
  var bus=document.getElementById("bus"), b=bus.getContext("2d");
  var W,H,dpr,L,beamY,spikeX;

  function size(){
    dpr=Math.min(2,devicePixelRatio||1); W=innerWidth; H=innerHeight;
    [fx,bus].forEach(function(cv){cv.width=W*dpr;cv.height=H*dpr});
    c.setTransform(dpr,0,0,dpr,0,0); b.setTransform(dpr,0,0,dpr,0,0);
    L=logo.getBoundingClientRect();
    beamY=L.top+(291-214)/112*L.height;
    spikeX=L.left+(486-214)/440*L.width;
  }
  /* traccia: piatta, con l'impulso del logo Power-Tools */
  function traceY(x){
    var u=(x-spikeX)/(L.width/440)/1.6, a=L.height/112*2.2;
    var k=[[-18,0],[-12,3],[-4,-9],[5,8],[13,-6],[19,2],[24,0]];
    if(u<=k[0][0]||u>=k[k.length-1][0])return beamY;
    for(var i=1;i<k.length;i++)if(u<=k[i][0]){var p=k[i-1],q=k[i],f=(u-p[0])/(q[0]-p[0]);return beamY+a*(p[1]+(q[1]-p[1])*f)}
    return beamY;
  }
  function path(x0,x1){c.beginPath();c.moveTo(x0,traceY(x0));for(var x=x0;x<=x1;x+=2)c.lineTo(x,traceY(x));c.lineTo(x1,traceY(x1))}
  function line(x1,alpha){c.save();c.strokeStyle="rgba(238,37,34,"+alpha+")";c.lineWidth=3.5;c.lineJoin="round";path(0,x1);c.stroke();c.restore()}
  /* testa luminosa con coda, come logo_anim.py */
  function head(hx,tail){
    var y0=Math.max(0,hx-tail*2.2),gr=c.createLinearGradient(y0,0,hx,0);   /* la traccia si accende al passaggio */
    gr.addColorStop(0,"rgba(238,37,34,0)");gr.addColorStop(1,"rgba(255,70,60,.95)");
    c.save();c.strokeStyle=gr;c.lineWidth=3.5;c.lineJoin="round";c.shadowColor=RED;c.shadowBlur=16;path(y0,Math.min(hx,W));c.stroke();c.restore();
    var x0=Math.max(0,hx-tail),g=c.createLinearGradient(x0,0,hx,0);
    g.addColorStop(0,"rgba(255,236,190,0)");g.addColorStop(.7,"rgba(255,236,190,.4)");g.addColorStop(1,"rgba(255,246,226,1)");
    c.save();c.globalCompositeOperation="lighter";c.strokeStyle=g;c.lineWidth=3.2;c.lineCap="round";c.lineJoin="round";c.shadowColor=HOT;c.shadowBlur=18;
    path(x0,Math.min(hx,W));c.stroke();c.restore();
  }
  /* luce che passa sulla scritta seguendo la testa (coordinate SVG) */
  function sheenAt(hx){sheen.setAttribute("x",214+(hx-L.left)/L.width*440-66)}
  function ease(t){return t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2}

  var t0=0,state="intro",pulse=-1,next=0;
  function frame(now){
    c.clearRect(0,0,W,H);
    if(state==="intro"){
      var k=Math.min(1,(now-t0)/2800), hx=-80+(W+160)*ease(k);
      line(W,.14); head(hx,280);
      var r=Math.min(100,Math.max(0,(L.right-hx)/L.width*100));        // il logo appare dietro la testa
      logo.style.clipPath="inset(-30% "+r+"% -30% 0)";
      sheenAt(hx);
      if(hx>L.left+L.width*.55)after.classList.add("on");
      if(k>=1){state="idle";logo.style.clipPath="";logo.classList.add("on");next=now+3000}
    } else {
      line(W,.14);
      if(pulse<0&&now>next)pulse=now;
      if(pulse>=0){var q=(now-pulse)/2800,px=-80+(W+160)*ease(Math.min(1,q));
        head(px,300);sheenAt(px);
        if(q>=1){pulse=-1;next=now+3600;sheenAt(-9999)}}
    }
    requestAnimationFrame(frame);
  }

  /* bus CAN in basso */
  var bits=[],off=0;for(var i=0;i<400;i++)bits.push(Math.random()<.45?0:1);
  function drawBus(){
    b.clearRect(0,0,W,H);var y=H-Math.max(120,H*.22),a=9,n=Math.ceil(W/14)+2,s0=Math.floor(off/14),f=off%14;
    b.lineWidth=1.4;
    [[RED,-1,0],["#3a4247",1,3]].forEach(function(cfg){b.strokeStyle=cfg[0];b.beginPath();
      for(var k=0;k<n;k++){var d=bits[(s0+k)%bits.length]===0,x=k*14-f,yy=d?y+cfg[1]*a*1.6+cfg[2]:y+cfg[2];
        if(k===0)b.moveTo(x,yy);else b.lineTo(x,yy);b.lineTo(x+14,yy)}b.stroke()});
  }
  function busLoop(){off+=1.2;drawBus();requestAnimationFrame(busLoop)}

  function start(){
    size();addEventListener("resize",function(){size();drawBus()});
    if(reduce){logo.classList.add("on");after.classList.add("on");drawBus();return}
    busLoop();t0=performance.now();requestAnimationFrame(frame);
  }
  addEventListener("keydown",function(e){if(e.key==="Enter")location.href="sito.html"});
  if(document.fonts&&document.fonts.ready)document.fonts.ready.then(start);else start();
})();
</script>
